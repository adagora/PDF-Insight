name: Public demo availability

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/check-production.ts --out availability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: availability-${{ github.run_id }}
          path: availability.json
          retention-days: 30
